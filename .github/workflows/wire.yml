# Publica los tweets de arranque y cierre de mapa.
#
# Arranca en SIMULACRO: sin la variable WIRE_LIVE en "true" solo imprime lo que
# habría publicado. Revisá un par de corridas antes de encenderlo.
name: wire

on:
  schedule:
    # OJO: este cron es una SUGERENCIA que GitHub casi nunca cumple.
    #
    # Medido sobre las últimas 60 corridas programadas: el hueco real entre una
    # y otra fue de 100 a 481 minutos, con MEDIANA de 185. Ni uno solo bajó de
    # 60. O sea que pedir "cada 30" da, en la práctica, una corrida cada tres
    # horas. Los eventos `schedule` son best-effort y se descartan cuando la
    # cola de runners está cargada.
    #
    # Por eso la cobertura NO la da el cron: la da WIRE_WATCH_MINUTES, que
    # sondea por dentro. Con la ventana en 5 h, cualquier disparo que llegue
    # dentro de ese rango encadena con el anterior y no queda hueco.
    - cron: '*/30 * * * *'
  workflow_dispatch:        # para correrlo a mano desde la pestaña Actions

concurrency:
  # Dos corridas a la vez pelearían por el archivo de estado y podrían publicar
  # dos veces lo mismo. Con `false` la siguiente ESPERA en vez de cancelar a la
  # que corre, así que cuando esta termina la que esperaba arranca enseguida:
  # eso es lo que encadena la cobertura.
  group: wire
  cancel-in-progress: false

permissions:
  contents: write           # solo para guardar el estado de la cola

jobs:
  wire:
    runs-on: ubuntu-latest
    # La corrida vigila 25 min por dentro; el margen cubre instalación y publicación.
    # La vigilancia interna dura 5 h; el margen cubre instalación y guardado.
    # El techo de un job en runner alojado es 6 h.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'    # trae fetch global

      # Única dependencia del proyecto, y solo del bot: el canvas para dibujar la
      # tarjeta. Si falla la instalación, el bot sigue y publica sin tarjeta.
      - name: Instalar el canvas
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Guardar el estado cada 15 min mientras vigila
        # La corrida dura hasta 5 h y el commit iba sólo al final: si se caía o
        # se pasaba del tiempo se perdían horas de "ya avisado", y lo ya
        # entregado volvía a salir. Este guardado de fondo acota esa pérdida a
        # 15 minutos.
        run: |
          nohup bash -c 'while true; do sleep 900; bash tools/guardar-estado.sh || true; done' \
            > /tmp/guardado-periodico.log 2>&1 &
          echo "guardado periódico en marcha (cada 15 min)"

      - name: Generar y publicar
        continue-on-error: true   # aunque falle, hay que guardar lo ya avisado
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          WIRE_LIVE: ${{ vars.WIRE_LIVE }}
          # Vigilancia continua dentro de la corrida. Ver el comentario en wire-bot.mjs:
          # el cron de Actions no cumple su frecuencia y esto es lo que la reemplaza.
          WIRE_WATCH_MINUTES: ${{ vars.WIRE_WATCH_MINUTES || '300' }}
          WIRE_POLL_SECONDS: ${{ vars.WIRE_POLL_SECONDS || '90' }}
          WIRE_VERIFY: ${{ vars.WIRE_VERIFY }}
          WIRE_LEAGUES: ${{ vars.WIRE_LEAGUES }}
          WIRE_MAX_PER_RUN: ${{ vars.WIRE_MAX_PER_RUN }}
          # Antigüedad máxima para que algo salga solo. Un "pre" viejo es falso
          # (anuncia como en vivo algo que ya terminó); un "post" viejo solo es tardío.
          WIRE_MAX_AGE_PRE_MIN: ${{ vars.WIRE_MAX_AGE_PRE_MIN || '45' }}
          WIRE_MAX_AGE_POST_HOURS: ${{ vars.WIRE_MAX_AGE_POST_HOURS || '12' }}
          WIRE_MEDIA: ${{ vars.WIRE_MEDIA }}
          WIRE_CARD: ${{ vars.WIRE_CARD }}
          WIRE_INTENT: ${{ vars.WIRE_INTENT }}
          WIRE_MAX_NOTIFY: ${{ vars.WIRE_MAX_NOTIFY }}
          # Solo para pruebas: rehacer y reenviar lo ya encolado.
          WIRE_REGENERATE: ${{ vars.WIRE_REGENERATE }}
          WIRE_RENOTIFY: ${{ vars.WIRE_RENOTIFY }}
          WIRE_PAUSE_HOURS: ${{ vars.WIRE_PAUSE_HOURS }}
          # Entrega gratuita: el tweet ya armado te llega y lo publicás de un toque.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Encendido en operación normal: con huecos de hasta 107 min entre corridas,
          # un mapa entero puede empezar y terminar sin ser visto, y getLive() solo
          # muestra lo que está en curso. El backfill lo rescata en el primer sondeo.
          WIRE_BACKFILL: ${{ vars.WIRE_BACKFILL || '6' }}
          # Ventana del corpus de Elo la primera vez que se construye. Después
          # cada corrida solo pide lo nuevo, así que esto casi no vuelve a pesar.
          WIRE_ELO_DAYS: ${{ vars.WIRE_ELO_DAYS || '150' }}
          # Presupuesto de tiempo del corpus por corrida. Con 15 ligas la primera
          # construcción es larga; las marcas de agua por liga la hacen reanudable.
          WIRE_ELO_PRESUPUESTO_MIN: ${{ vars.WIRE_ELO_PRESUPUESTO_MIN || '8' }}
          WIRE_MATCH: ${{ vars.WIRE_MATCH }}
          WIRE_ONLY: ${{ vars.WIRE_ONLY }}
        run: node tools/wire-bot.mjs

      - name: Guardar el estado de la cola y el corpus de Elo
        if: always()   # aunque el bot falle, lo ya avisado tiene que quedar registrado
        run: bash tools/guardar-estado.sh
